# SIGNUP
# =========================================================

spring.cloud.gateway.server.webflux.routes[0].id=signup-1
spring.cloud.gateway.server.webflux.routes[0].uri=${creation.service.1.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/users/signup
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=POST
spring.cloud.gateway.server.webflux.routes[0].predicates[2]=Weight=creation-signup,50

spring.cloud.gateway.server.webflux.routes[0].filters[0].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.replenishRate=2
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.burstCapacity=3
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.redis-rate-limiter.key-resolver=#{@userKeyResolver}


