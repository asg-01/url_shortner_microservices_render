server.port=${PORT:8080}
spring.application.name=api-gateway


# =========================================================
# SERVICE URLS
# =========================================================

# Local defaults.
# Docker/Render will override these using environment variables.

creation.service.1.url=${CREATION_SERVICE_1_URL:http://localhost:8081}
creation.service.2.url=${CREATION_SERVICE_2_URL:http://localhost:8083}

redirect.service.1.url=${REDIRECT_SERVICE_1_URL:http://localhost:8082}
redirect.service.2.url=${REDIRECT_SERVICE_2_URL:http://localhost:8084}


# =========================================================
# LOAD BALANCER
# =========================================================

spring.cloud.loadbalancer.retry.enabled=true
spring.cloud.loadbalancer.retry.max-retries-on-next-service-instance=1
spring.cloud.loadbalancer.retry.max-retries-on-same-service-instance=0
spring.cloud.loadbalancer.retry.avoid-previous-instance=true


# =========================================================
# CORS
# =========================================================

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_URL:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,X-Requested-With,Idempotency-Key
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true


# =========================================================
# REDIS / VALKEY
# =========================================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET:my-super-secret-key-for-url-shortener-123456}


# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info


