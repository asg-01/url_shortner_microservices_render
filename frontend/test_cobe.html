<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  </style>
  <script type="module">
    import createGlobe from 'https://cdn.skypack.dev/cobe';

    let phi = 0;
    let canvas = document.getElementById("cobe");

    const globe = createGlobe(canvas, {
      devicePixelRatio: 2,
      width: 640,
      height: 640,
      phi: 0,
      theta: 0,
      dark: 1,
      diffuse: 1.2,
      scale: 1,
      mapSamples: 16000,
      mapBrightness: 6,
      baseColor: [0.1, 0.13, 0.23],
      markerColor: [0.65, 0.88, 0.27],
      glowColor: [0.42, 0.38, 1],
      markers: [],
      onRender: (state) => {
        state.phi = phi;
        phi += 0.005;
      },
    });
  </script>
</head>
<body>
  <canvas id="cobe" style="width: 320px; height: 320px;" width="640" height="640"></canvas>
</body>
</html>
